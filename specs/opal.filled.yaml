# Hand-authored per-column build content for opal.yaml.
# compile.py reads this automatically on every recompile, keyed by
# check/fit-condition id under l0/l1, plus top-level markers (like
# CONTEXT_FIELDS) for slots the templates can't fill deterministically.
# Delete a key to force that column back to a {{CLAUDE:...}} marker.

l0:
  headcount_contraction:
    inputs: /Headcount Growth 12mo
    body: /Headcount Growth 12mo <= 0

  size_floor:
    inputs: /Employee Count, /Description
    body: |
      Disqualified = TRUE if headcount < 75, or there's no detectable
      dedicated security or IT function (not even a single named
      security/IT hire visible in the description or job history).
      No UNKNOWN state: missing enrichment data should pass through as
      FALSE, same as any other L0 check with absent evidence.

  size_ceiling:
    inputs: /Company Name, /Website, /Employee Count
    body: |
      Determine whether {{Company Name}} meets this condition:
      has over 5000 employees AND has an entrenched, publicly-documented
      SailPoint or Saviynt enterprise deployment

      Search: press releases, procurement mentions, case studies,
      systems-integrator announcements

      Return only: TRUE, FALSE, or UNKNOWN.
      Return TRUE only with a specific source you can point to — both the
      headcount and the entrenched-deployment half need evidence, not
      just one.
      Return UNKNOWN when evidence is absent rather than guessing FALSE.

  competing_supply:
    inputs: /Company Name, /Website
    body: |
      Determine whether {{Company Name}} meets this condition:
      builds or sells an identity governance and administration (IGA),
      identity and access management (IAM), or privileged access
      management (PAM) product (e.g. SailPoint, Saviynt, ConductorOne,
      Veza, Zluri, Lumos, Okta, CyberArk, BeyondTrust, One Identity,
      Britive)

      Search: product and pricing pages

      Return only: TRUE, FALSE, or UNKNOWN.
      Return TRUE only with a specific source you can point to.
      Return UNKNOWN when evidence is absent rather than guessing FALSE.

  existing_customer:
    inputs: /Company Name, /Website
    body: |
      First check {{Company Name}} against this known-customer list —
      confirmed via opal.dev's customer/case-study pages and Opal's
      June 4 2026 funding/leadership press release
      (opal.dev/media-press/opal-security-raises-23m-new-leadership):
      Databricks, Chronosphere, Blend, Mercari, Sophos, Valon, CoinList,
      Grammarly, Notion, Cloudflare, Scale AI, CoreWeave, xAI (named
      "SpaceXAI" in Opal's materials post-acquisition by SpaceX),
      Superhuman, Elastic, Merge. If {{Company Name}} matches one of
      these (including "xAI" for "SpaceXAI"), return TRUE immediately —
      no search needed.

      If it isn't on the list, determine whether {{Company Name}} meets
      this condition: is already an Opal Security (opal.dev) customer
      today (e.g. named on opal.dev's customer/case-study pages, named
      in an Opal press release, or identified as a current user in a G2
      review from an employee). This list will go stale — new customers
      won't be on it — so still run the search for anything not listed
      above rather than defaulting to FALSE.

      Search: opal.dev customer and case-study pages, press releases,
      G2 reviews naming the account

      Return only: TRUE, FALSE, or UNKNOWN.
      Return TRUE only with a specific source you can point to.
      Return UNKNOWN when evidence is absent rather than guessing FALSE.

  iga_lockin:
    inputs: /Company Name, /Website
    body: |
      Determine whether {{Company Name}} meets this condition:
      has publicly documented evidence of a large-scale SailPoint,
      Saviynt, or Okta Identity Governance implementation completed or
      actively underway within the last 18 months (e.g. a case study, a
      systems-integrator press release, or a job post describing an
      active rollout of one of these platforms specifically).

      A job post merely naming one of these tools among many is NOT
      enough — that's ambiguous. Only return TRUE for a named
      implementation project, a case study naming the platform as their
      chosen system, or a press release announcing the deployment.

      Search: press releases, case studies, job posts describing an
      active rollout, systems-integrator announcements

      Return only: TRUE, FALSE, or UNKNOWN.
      Return TRUE only with a specific source you can point to.
      Return UNKNOWN when evidence is absent rather than guessing FALSE.

  wrong_shape:
    inputs: /Description, /Employee Count
    body: |
      Not a search — classify from {{Company Name}}'s existing company
      description alone, no external lookup needed.
      Disqualified = TRUE if the company shows no material
      distinct-identity surface to govern: a services/consulting business,
      agency, or small team running on a handful of native-SaaS admin
      panels (e.g. just Google Workspace and Slack), with no visible
      engineering function, infrastructure footprint, or need for service
      accounts and role-based access beyond basic SaaS admin.

      Return only: TRUE, FALSE, or UNKNOWN.
      Return UNKNOWN only if the description genuinely doesn't say enough
      to classify at all — not as a substitute for FALSE.

l1:
  identity_surface_exists:
    cost: cheap
    inputs: /Description, /Job Titles
    summary: Has an engineering or IT function running distinct systems, cloud infrastructure, or service accounts — even a small one.
    body: |
      Classify from {{Company Name}}'s company description and any
      visible job titles: does the company run its own cloud
      infrastructure, distinct internal systems, or service accounts (an
      engineering or IT function of any size), rather than operating
      entirely on off-the-shelf SaaS with no infrastructure footprint?
      Not a search — use what enrichment already has.

      Return only: TRUE, FALSE, or UNKNOWN.
      Return UNKNOWN only if there's genuinely not enough information to
      tell.

  regulated_or_enterprise_customer_base:
    cost: search
    inputs: /Company Name, /Website
    summary: Sells to regulated industries (finance, healthcare) or enterprise customers who run vendor security reviews.
    body: |
      Determine whether {{Company Name}} meets this condition:
      sells to financial services, healthcare, government, or other
      regulated-industry customers, OR sells to enterprise customers
      large enough to run a formal vendor security review or SOC 2
      request as part of procurement.

      Search: customer/case-study pages, target-market or "who we serve"
      pages, industry vertical mentioned in job posts or press

      Return only: TRUE, FALSE, or UNKNOWN.
      Return TRUE only with a specific source you can point to.
      Return UNKNOWN when evidence is absent rather than guessing FALSE.

  deploying_ai_agents_with_system_access:
    cost: search
    inputs: /Company Name, /Website
    summary: Publicly building or deploying AI agents with access to internal systems, infrastructure, or customer data.
    body: |
      Determine whether {{Company Name}} meets this condition:
      is publicly building, deploying, or piloting AI agents with access
      to internal systems, production infrastructure, or customer data
      (not merely using an off-the-shelf AI coding assistant with no
      system access).

      Search: engineering blog, press, job posts describing agentic/AI
      infrastructure work

      Return only: TRUE, FALSE, or UNKNOWN.
      Return TRUE only with a specific source you can point to.
      Return UNKNOWN when evidence is absent rather than guessing FALSE.

CONTEXT_FIELDS: >-
  employee headcount, industry (flag regulated: finance/healthcare/
  crypto/AI), whether the company sells to enterprise or regulated
  customers, any public mention of a blocked deal, security review, or
  new SOC 2 Type II / ISO 27001 certification, any public mention of AI
  agents with production or system access, current IGA/IAM tooling
  mentioned in job posts or press (if any), and the L1 fit condition(s)
  that passed. When the evidence cites a specific number of managed
  identities, entitlements, or access requests, use Opal's own published
  mature-deployment scale as a rough anchor, not a threshold to enforce:
  Databricks runs 86,000 just-in-time access requests through Opal;
  Mercari governs 5,000+ Okta entitlements through automated reviews.
  A prospect whose evidence implies an access-management surface
  nowhere near that scale isn't disqualified by that alone, but it's a
  useful sense check on whether the account's identity complexity is in
  a plausible range for this category at all.

OFFER_TYPE_REASONING: >-
  A company formalizes identity governance because a specific
  enterprise or regulated deal is stalling on access controls, or
  because it just created a new class of non-human identity (AI agents)
  its existing tooling wasn't built to govern — not because Opal's pitch
  itself creates the need. Serves Opal's single sales-assisted,
  demo-gated motion; there is no self-serve segment to exclude the way
  ramp/figma/snyk had to.

SCOPE_EXCLUSIONS: |-
  - Existing Opal customers (see L0 `existing_customer`) — the pipeline
    this spec is for is net-new logos, not expansion within accounts
    Opal's own CRM already tracks. If Opal has direct CRM access, that
    list should replace this Claygent check rather than re-deriving it
    externally (see SKILL.md Step 1's telemetry check).
  - Companies over 5,000 employees already entrenched in a competing IGA
    platform (see L0 `size_ceiling` and `iga_lockin`) — large enterprises
    are otherwise in-scope, not excluded by size alone.
  - Pure consulting/agency businesses with no material infrastructure or
    identity surface to govern (see L0 `wrong_shape`).
