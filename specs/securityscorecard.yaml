client: securityscorecard
offer: >-
  continuous third-party/vendor cybersecurity risk ratings and monitoring
  (TITAN AI platform — vendor discovery, automated questionnaires, and
  threat response for third-party risk management)
motion: >-
  sales-assisted enterprise TPRM (a free instant scorecard lookup exists
  as a lead-gen self-serve motion, but the paid platform is demo-gated
  and sales-led across all four maturity tiers on their pricing page;
  this spec targets net-new logos buying the paid program, not existing
  customers expanding seats or the free lookup traffic)

sourcing:
  # Two segments, not one OR'd prompt. An earlier draft joined these with
  # "OR public companies... any industry" in a single Clay prompt; the
  # "any industry" branch let the filter builder pull in entertainment,
  # e-learning, and consumer software alongside the intended financial
  # and healthcare targets, with the noise invisible until the list came
  # back. Split into two AND-only segments, built and L0-screened
  # separately, unioned afterward — this also surfaces which of the two
  # populations is actually worth sourcing from.
  segments:
    - name: regulated_industry
      description: >
        Companies with 100-10,000 employees in the Financial Services,
        Healthcare, Insurance, or Critical Infrastructure (Energy,
        Utilities, or Telecommunications) industries. Headquartered in
        the United States, United Kingdom, Germany, France, Netherlands,
        Ireland, Spain, or Italy.
      filters:
        - 100-10,000 employees
        - "industry: Financial Services, Healthcare, Insurance, Energy, Utilities, or Telecommunications"
        - "country: United States, United Kingdom, Germany, France, Netherlands, Ireland, Spain, or Italy"
      expected_row_count: 900-1,800
    - name: public_company_any_industry
      description: >
        Public companies with 500-10,000 employees, in any industry.
        Headquartered in the United States, United Kingdom, Germany,
        France, Netherlands, Ireland, Spain, or Italy.
      filters:
        - 500-10,000 employees
        - public company (listed on a stock exchange)
        - any industry
        - "country: United States, United Kingdom, Germany, France, Netherlands, Ireland, Spain, or Italy"
      expected_row_count: 600-1,200
  # Ceiling set at 10,000 on both segments, below existing_customer's
  # largest named references — Truist (~40,000), KION Group (~42,000),
  # Hershey (~18,000), ADT (~15,000) — all well above it. That segment
  # is where SecurityScorecard's own published customer base already
  # concentrates; this build deliberately targets the next tier down
  # (still regulated or public, still floor-qualified) rather than
  # resourcing straight into accounts already converted. Smaller
  # published references (Clyde, Solarig, CEDIA, PayPoint) fall inside
  # the sourced band and stay reachable for L0's existing_customer check
  # to actually fire on.
  deliberately_omitted:
    - check: competing_supply
      why: >
        Whether a company builds or sells a competing ratings/TPRM
        platform (BitSight, UpGuard, Panorays) is a product/positioning
        read — L0's job, not something headcount or industry tags
        resolve.
    - check: existing_customer
      why: >
        Whether a company is already a published SecurityScorecard
        reference customer only shows up in case studies and press —
        sourcing has no free way to check this at list-build time.
    - check: competitor_lockin
      why: >
        A public multi-year commitment to a competing ratings vendor
        only surfaces in procurement mentions and case studies, exactly
        what L0 exists to read instead of sourcing guessing at it.

intake:
  offer_type: readiness
  buying_event_hypothesis: >
    A company is forced to formalize third-party risk oversight — either
    because a regulatory deadline (DORA, NYDFS Part 500, SEC disclosure
    rules) now requires it, or because a vendor/supplier of theirs just
    caused a breach that exposed the gap in board-visible terms.
  hypothesis_confidence: inferred
  hypothesis_evidence: >
    Repeats across SecurityScorecard's own published case studies: KION
    Group moving from manual to automated vendor monitoring, Truist
    wanting targeted vendor engagement over broad outreach (a maturing
    program, not a first purchase), a semiconductor manufacturer
    responding to a "time-sensitive vendor security issue," and a
    healthcare company citing a 96% reduction in vendor-assessment time
    (pain from manual questionnaires). SecurityScorecard's own regulatory
    pages name DORA, NYDFS Part 500, and SEC cyber disclosure rules as
    explicit third-party-oversight mandates. Separately, Verizon's 2026
    DBIR reports third-party breaches now appear in 48% of confirmed
    incidents, up 60% year-over-year — and the 2026 Xsolis vendor breach
    (exposing patient data at Mayo Clinic and six other hospital systems)
    is a live example of the incident-driven version. This is
    pattern-matching across a handful of curated, published case
    studies, not a verified sales-cycle account of what happens before a
    contract is signed — the same selection-bias caveat figma and snyk
    carry. No deal data on which of the two — regulation or incident —
    more often closes the deal, or how long after either one the window
    stays open.
  signal_surface: [press, sec_filings, job_posts, procurement_rfps,
                    regulatory_disclosures, breach_notifications, industry_news]
  window_length: 90-120 days
  purchase_owner: CISO / Head of GRC / VP Third-Party Risk
  demand_noun: need for continuous third-party risk visibility

discovery:
  - Of net-new logos, how many trace to a regulatory deadline (DORA,
    NYDFS, SEC) versus a vendor-caused incident versus a maturing program
    with no single triggering event?
  - How long between the triggering event and a signed contract — days,
    for an incident, or a full compliance cycle for a regulatory driver?
  - Where does the size floor for a formal TPRM program actually sit
    outside regulated industries, and does the free scorecard-lookup
    motion already convert that segment without a rep?

disqualify:
  - id: headcount_contraction
    kills: 12-month headcount growth <= 0%
    cost: free
    note: >
      Same Enrich Company call that returns employee count also returns
      12-month growth — free once enrichment is already running. A
      company shedding headcount is very likely under a procurement
      freeze regardless of offer.
    detect_via: company enrichment (Enrich Company payload)
  - id: size_floor
    kills: >
      under 500 employees, unless in a regulated industry (financial
      services, healthcare, insurance, critical infrastructure) or a
      public company, where the floor drops to under 100 — formal TPRM
      programs form later outside regulated sectors, but regulation
      (DORA, NYDFS, SEC, HIPAA/GLBA oversight of vendors) pulls the floor
      down regardless of size; also kills over 10,000 employees
    cost: free
    note: >
      Ceiling added to match sourcing's own 10,000-employee cap on both
      segments — without one here, L0 depended entirely on sourcing
      holding the line, and any row that slipped past sourcing (a manual
      addition, a future segment with a higher band) had nothing to
      catch it.
    detect_via: company enrichment, industry classification, public-company status
  - id: wrong_shape
    kills: >
      is a professional or trade association, a standards organization,
      a multilateral or intergovernmental body, a government agency, or
      a university/academic institution — entity types with no
      signal-based buying motion this build targets
    cost: cheap
    note: >
      Revised from an earlier "no material third-party technology
      dependency or physical supply chain" framing, which wasn't
      mechanically checkable from a description alone — this version is,
      straight off entity type. Two of SecurityScorecard's own published
      references sit close to this line: the Insurance Authority of Hong
      Kong (a government regulator) and CEDIA (an academic/research
      network in Ecuador). Accepted anyway — a government regulator or
      academic network buying TPRM tooling is the exception this build
      isn't sized to chase, not the segment it targets.
    detect_via: company description
  - id: existing_customer
    kills: already a SecurityScorecard customer today
    examples: [Truist, Hershey, ADT, PayPoint, KION Group, Clyde, Solarig, CEDIA]
    cost: search
    note: >
      These are SecurityScorecard's own published case-study and
      reference customers. Existing accounts are the segment where
      SecurityScorecard's own usage data (vendors monitored, seats
      active, plan-tier hits) beats anything external enrichment can
      reconstruct — this build targets net-new only, same reasoning as
      Snyk's existing_customer check. Narrow search against a known
      list — ordered before the broad searches below.
    detect_via: securityscorecard.com case studies and customer-stories pages, press releases, G2 reviews naming the account
  - id: competing_supply
    kills: builds or sells a competing security-ratings or third-party risk management platform
    examples: [BitSight, UpGuard, Panorays, Black Kite, ProcessUnity, Prevalent, CyberGRX, Venminder, RiskRecon]
    cost: search
    detect_via: product pages, pricing pages, positioning
  - id: competitor_lockin
    kills: >
      public multi-year enterprise agreement with, or deeply embedded
      standard platform of, a competing ratings/TPRM vendor — not merely
      appearing on one, which every company does
    examples: [BitSight, UpGuard, Panorays, ProcessUnity]
    cost: search
    note: >
      Distinguish from a job post that merely mentions one of these
      tools — that's weak, ambiguous evidence and belongs in tier_b
      (vendor_risk_job_keywords), not here. Needs a public multi-year
      commitment or the vendor named as their standing platform in a
      case study, the same bar BlackLine's GCP lock-in met for Together
      AI. Sandbox testing on 10 rows caught a sharper false-positive:
      the check returned TRUE for Blackstone and Carlyle on
      upguard.com/security-report/<company> URLs — UpGuard's
      auto-generated public ratings pages, published unilaterally with
      no customer relationship. Every company in the category-defining
      business of rating other companies' security posture has one of
      these; being rated by a vendor is the opposite of being their
      customer. Prompt now explicitly excludes auto-generated
      ratings/scorecard/profile pages as evidence. This is specific to
      TPRM/ratings vendors, whose product output is a public page about
      a non-customer — none of the other four specs' competitor sets
      (cloud providers, card issuers, AppSec scanners, design tools)
      publish anything structurally similar, so no equivalent exclusion
      was needed there.
    detect_via: press releases, procurement mentions, case studies, vendor customer/partner pages (NOT auto-generated ratings/scorecard/profile pages)

fit:
  # required was originally has_vendor_or_supply_chain_exposure, asking
  # whether the business "relies on material third-party vendors" —
  # true of nearly every company over 500 employees, and answerable
  # from no public page. Sandboxed on 10 rows: returned UNKNOWN on
  # every single one, so Fit = false everywhere and nothing could ever
  # qualify. Replaced with a mechanical, artifact-based check — same
  # fix pattern as L0's wrong_shape.
  required: publishes_vendor_governance_artifact
  any_of:
    - regulated_industry     # finance, healthcare, insurance, critical infrastructure — DORA/NYDFS/SEC/HIPAA/GLBA third-party oversight applies
    - large_vendor_ecosystem # 100+ SaaS/cloud vendors, or a multi-tier physical supply chain
    - public_company         # SEC cyber disclosure rules cover material third-party incidents

window:
  tier_a:
    - type: regulatory_deadline
      tightness: tight
      implies: >
        A financial entity in scope for DORA, or a NY-regulated financial
        services company certifying under NYDFS Part 500, must
        demonstrate continuous third-party monitoring to pass the audit —
        the compliance deadline is the purchase trigger, not a side
        effect of it.
      note: newly published DORA/NYDFS/SEC compliance page, or an announced program covering third-party ICT risk
      lookback_days: 120
    - type: third_party_breach_disclosure
      tightness: tight
      implies: >
        A company that just disclosed a breach traced to a vendor or
        supplier has an active, board-visible gap in third-party
        visibility — the incident is the purchase trigger. The 2026
        Xsolis breach (Mayo Clinic and six other hospital systems) is
        the clearest live example of this pattern.
      note: press release, SEC filing, or breach notification naming a third-party/vendor as the source
      lookback_days: 90
    - type: first_tprm_hire
      tightness: tight
      implies: >
        A company's first dedicated Third-Party Risk or Vendor Risk
        Manager is hired specifically to select and own this tooling —
        the role doesn't exist until the decision is imminent.
      titles: [Head of Third-Party Risk, Director of Vendor Risk Management,
               Third-Party Risk Manager, VP Third-Party Risk,
               Head of Vendor Risk Management]
      lookback_days: 90
    - type: security_questionnaire_mandate
      tightness: medium
      implies: >
        A company that begins requiring a security rating or
        questionnaire from its own vendors (new RFP language, procurement
        policy update, vendor-onboarding page) is standing up a formal
        program now, though the mandate could be met with a manual
        process instead of a platform.
      note: RFP, procurement policy, or vendor-onboarding page newly requiring a security rating or questionnaire
      lookback_days: 90
  tier_b:
    - type: ciso_hire
      titles: [CISO, VP Security, Chief Information Security Officer, Head of GRC]
      lookback_days: 90
    - type: ma_activity
      note: recent acquisition or merger expanding the vendor/supply chain surface
      lookback_days: 180
    - type: vendor_risk_job_keywords
      terms: [third-party risk, vendor risk management, TPRM, vendor security assessment,
              supply chain risk, SIG questionnaire]
      lookback_days: 90
  tier_c:
    - type: general_security_hiring_volume
    - type: headcount_growth

penalty:
  - trigger: >
      published case study, testimonial, or logo placement naming a
      competing ratings/TPRM vendor (BitSight, UpGuard, Panorays, Black
      Kite, ProcessUnity, Prevalent, CyberGRX, Venminder) as their chosen
      platform
    lookback_months: 12
    points: -30

scoring:
  threshold: 55
  # Custom recency table: regulatory_deadline carries a 120-day lookback
  # (see window.tier_a), but the compiler's default recency brackets cap
  # at 90 days — a signal at day 100 would count as Tier A yet score
  # zero, gating on tier_a_count without contributing points. Added a
  # 91-120 bracket so the recency multiplier actually covers the tier's
  # own longest lookback instead of silently truncating it.
  recency:
    - {max_days: 30, multiplier: 1.0}
    - {max_days: 60, multiplier: 0.8}
    - {max_days: 90, multiplier: 0.6}
    - {max_days: 120, multiplier: 0.4}

regression:
  - account: bitsight.com
    expect: DISQUALIFIED
    at_layer: competing_supply
    note: sells a directly competing security-ratings/TPRM product
  - account: truist.com
    expect: DISQUALIFIED
    at_layer: existing_customer
    note: published SecurityScorecard case study — "targeted vendor engagement over broad outreach"
  - account: mayoclinic.org
    expect: QUALIFIED
    rationale_must_cite: third_party_breach_disclosure
    note: >
      confirmed patient impact (disclosed April 2026) from the Xsolis
      vendor breach exposing ~1.4M patients' data across seven hospital
      systems — regulated healthcare, large vendor ecosystem, live
      board-visible third-party gap
